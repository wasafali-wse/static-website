<style>
  body {
    font-family: 'Roboto', sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
    color: #333;
  }

  header {
    background-color: #007bff;
    padding: 20px 0;
    text-align: center;
    color: #fff;
  }

  header h1 {
    margin: 0;
    font-size: 2em;
    letter-spacing: 1px;
  }

  main {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }

  section {
    margin-bottom: 40px;
  }

  h2 {
    color: #007bff;
    border-bottom: 2px solid #007bff;
    padding-bottom: 8px;
    margin-bottom: 20px;
    font-size: 1.5em;
  }

  ul {
    list-style: none;
    padding-left: 0;
  }

  li {
    margin-bottom: 12px;
    padding-left: 20px;
    position: relative;
  }

  li::before {
    content: "•";
    color: #007bff;
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2em;
  }

  a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
    transition: color 0.3s, transform 0.2s;
  }

  a:hover {
    color: #007bff;
    transform: translateX(4px);
  }

  /* Responsive adjustments */
  @media (max-width: 600px) {
    header h1 {
      font-size: 1.5em;
    }

    h2 {
      font-size: 1.3em;
    }

    li {
      padding-left: 15px;
    }
  }

  /* Footer style */
  footer {
    text-align: center;
    padding: 20px 0;
    background-color: #fff;
    border-top: 1px solid #ddd;
    font-size: 0.9em;
    color: #555;
  }
