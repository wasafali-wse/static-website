<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sitemap - Waheedsons Engineering</title>
<!-- Google Fonts for a modern look -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" />
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  /* Reset and base styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    background-color: #f0f4f8;
    color: #333;
    line-height: 1.6;
  }

  /* Header */
  header {
    background-color: #0d6efd;
    padding: 30px 20px;
    text-align: center;
    color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }

  header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
  }

  /* Main content */
  main {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }

  /* Sections */
  section {
    margin-bottom: 50px;
  }

  h2 {
    font-size: 2em;
    margin-bottom: 20px;
    color: #0d6efd;
    border-bottom: 2px solid #0d6efd;
    display: inline-block;
    padding-bottom: 8px;
  }

  /* List styles */
  ul {
    list-style: none;
  }

  li {
    margin-bottom: 15px;
    padding-left: 35px;
    position: relative;
    font-size: 1.1em;
    transition: background-color 0.3s, transform 0.2s;
  }

  li:hover {
    background-color: #e9f0fb;
    transform: translateX(5px);
    border-radius: 8px;
  }

  /* Icons before links */
  li::before {
    content: "\f07b"; /* Font Awesome globe icon */
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2em;
    color: #0d6efd;
  }

  /* Links styles */
  a {
    text-decoration: none;
    color: #333;
    font-weight: 600;
    display: inline-block;
    transition: color 0.3s, transform 0.2s;
  }

  a:hover {
    color: #0d6efd;
    transform: translateX(4px);
  }

  /* Responsive adjustments */
  @media(max-width: 600px) {
    header h1 {
      font-size: 2em;
    }
    h2 {
      font-size: 1.5em;
    }
    li {
      padding-left: 30px;
      font-size: 1em;
    }
  }

  /* Footer */
  footer {
    background-color: #fff;
    padding: 20px 10px;
    text-align: center;
    font-size: 0.9em;
    color: #555;
    border-top: 1px solid #ddd;
  }
</style>
</head>
<body>

<header>
  <h1>Sitemap of Waheedsons Engineering</h1>
</header>

<main>
  <section>
    <h2>Homepage</h2>
    <ul>
      <li><a href="https://waheedsons-engineering.com/">Home</a></li>
      <li><a href="https://waheedsons-engineering.com/index.html">Main Page</a></li>
    </ul>
  </section>

  <section>
    <h2>Pages</h2>
    <ul>
      <li><a href="https://waheedsons-engineering.com/pages/projects.html">Projects</a></li>
      <li><a href="https://waheedsons-engineering.com/pages/blogs.html">Blogs</a></li>
      <li><a href="https://waheedsons-engineering.com/pages/about.html">About Us</a></li>
      <li><a href="https://waheedsons-engineering.com/pages/services.html">Services</a></li>
      <li><a href="https://waheedsons-engineering.com/pages/why_us.html">Why Us</a></li>
    </ul>
  </section>
</main>

<footer>
  &copy; 2025 Waheedsons Engineering. All rights reserved.
</footer>

</body>
</html>
